# Implantação em um servidor: copie .env.example para .env, ajuste os valores e rode
# `docker compose up -d --build`. Veja docs/deployment.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: clinica
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinica']
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://clinica:${POSTGRES_PASSWORD}@db:5432/clinica
      WEB_ORIGIN: ${WEB_ORIGIN:?defina WEB_ORIGIN no .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
